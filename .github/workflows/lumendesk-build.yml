name: Build Windows Client

# 说明
# ----
# 与上游 CI（.github/workflows-disabled/flutter-build.yml）对齐的三处关键做法：
#   1. vcpkg 固定在 vcpkg.json 里声明的 baseline（9e593bb1），避免 runner 自带的
#      版本与清单不一致导致端口解析失败。
#   2. 依赖安装用 classic 模式（cwd 切到 C:\vcpkg）。仓库根目录有 vcpkg.json，
#      在根目录执行 `vcpkg install <包名>` 会进入 manifest 模式，而 manifest 模式
#      不接受单独指定包名，会直接报错退出——这是上一次 73 秒失败的原因。
#   3. overlay 端口用仓库自带的 res/vcpkg，而不是外部目录。res/vcpkg 里含
#      aom / libvpx / libyuv / opus 的上游补丁，缺了这些补丁安装阶段会失败。
#
# 只装 RustDesk 实际链接的 4 个库（libvpx / aom / libyuv / opus），跳过 ffmpeg：
# libs/scrap/build.rs 里 `// ffmpeg();` 是注释状态，纯软件编码路径不需要它，
# 可省下约 40 分钟构建时间。
#
# 上游自带的 11 个 workflow 已移至 .github/workflows-disabled/，
# GitHub 只扫描 workflows 顶层目录，因此不会被执行。

on:
  push:
    branches: [master, main]
  workflow_dispatch:

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  # 与 vcpkg.json 的 vcpkg-configuration.default-registry.baseline 保持一致
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  # 与上游 build-for-windows-flutter 任务一致（Cargo.lock 就是按该版本锁定的）
  RUST_VERSION: "1.75"
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build-windows:
    name: 构建 Windows 客户端
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 准备 vcpkg（固定到清单声明的版本）
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          runVcpkgInstall: false
          doNotCache: false

      - name: 安装 Rust
        # 与上游 CI 相同的固定版本（v1 的 SHA）
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc

      - name: 安装 Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.5
          channel: stable
          cache: true

      - name: 缓存 cargo 构建产物
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-

      - name: 缓存 vcpkg 已编译依赖
        id: vcpkg-cache
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\buildtrees
          key: vcpkg-${{ hashFiles('vcpkg.json') }}-${{ hashFiles('res/vcpkg/**') }}

      - name: 编译原生依赖
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          # classic 模式：切到 vcpkg 目录执行，绕开 manifest 模式不接受包名的限制
          Push-Location "C:\vcpkg"
          & "C:\vcpkg\vcpkg.exe" install libvpx aom libyuv opus `
            --triplet x64-windows-static `
            --x-install-root="C:\vcpkg\installed" `
            --overlay-ports="$env:GITHUB_WORKSPACE\res\vcpkg"
          $code = $LASTEXITCODE
          Pop-Location

          if ($code -ne 0) {
            Write-Host "::group::vcpkg 构建日志"
            Get-ChildItem "C:\vcpkg\buildtrees" -Recurse -Filter "*.log" -ErrorAction SilentlyContinue |
              ForEach-Object {
                Write-Host "===== $($_.FullName) ====="
                Get-Content $_.FullName -Tail 40
              }
            Write-Host "::endgroup::"
            throw "vcpkg install 失败（exit $code）"
          }

          Get-ChildItem "C:\vcpkg\installed\x64-windows-static\lib" -ErrorAction SilentlyContinue |
            Select-Object Name, @{N='MB';E={[math]::Round($_.Length/1MB,1)}} |
            Format-Table -AutoSize

      - name: 生成 flutter_rust_bridge 绑定
        shell: pwsh
        env:
          # codegen 内部走 cargo expand，会构建 scrap 的 build script，
          # 因此必须能定位到上一步装好的原生库
          VCPKG_ROOT: C:\vcpkg
          VCPKG_DEFAULT_TRIPLET: x64-windows-static
          FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
          CARGO_EXPAND_VERSION: "1.0.95"
        run: |
          # src/bridge_generated*.rs 与 flutter/lib/generated_bridge*.dart 都在
          # .gitignore 里，仓库不带这两组文件，必须现场生成
          cargo install cargo-expand --version $env:CARGO_EXPAND_VERSION --locked
          cargo install flutter_rust_bridge_codegen --version $env:FLUTTER_RUST_BRIDGE_VERSION --features uuid --locked

          Push-Location flutter
          flutter pub get
          Pop-Location

          # 用绝对路径调用，避免 PATH 里 cargo bin 未生效
          $codegen = Join-Path $env:USERPROFILE ".cargo\bin\flutter_rust_bridge_codegen.exe"
          & $codegen `
            --rust-input ./src/flutter_ffi.rs `
            --dart-output ./flutter/lib/generated_bridge.dart
          if ($LASTEXITCODE -ne 0) { throw "flutter_rust_bridge_codegen 失败" }

          $need = @(
            "src\bridge_generated.rs",
            "src\bridge_generated.io.rs",
            "flutter\lib\generated_bridge.dart"
          )
          foreach ($f in $need) {
            if (-not (Test-Path $f)) { throw "未生成 $f" }
            Write-Host "OK  $f"
          }

          # 若生成的 dart 里声明了 freezed part，则需要 build_runner 产出配套文件
          $dart = "flutter\lib\generated_bridge.dart"
          $freezed = "flutter\lib\generated_bridge.freezed.dart"
          if ((Select-String -Path $dart -Pattern "generated_bridge\.freezed\.dart" -Quiet) -and
              -not (Test-Path $freezed)) {
            Write-Host "缺少 freezed 配套文件，运行 build_runner"
            Push-Location flutter
            dart run build_runner build --delete-conflicting-outputs
            $br = $LASTEXITCODE
            Pop-Location
            if ($br -ne 0) { throw "build_runner 失败" }
            if (-not (Test-Path $freezed)) { throw "仍未生成 $freezed" }
          }

      - name: 编译 Rust 核心
        shell: pwsh
        env:
          VCPKG_ROOT: C:\vcpkg
          VCPKG_DEFAULT_TRIPLET: x64-windows-static
        run: |
          rustc --version
          cargo --version

          # 不用 --locked：Cargo.toml 用上游的 git 依赖（portable-pty 走
          # rustdesk-org/wezterm），锁文件里的 registry 记录需据此重新解析
          cargo build --features flutter --lib --release 2>&1 |
            Tee-Object -FilePath cargo-build.log
          $code = $LASTEXITCODE

          if ($code -ne 0) { throw "cargo build 失败（exit $code）" }
          if (-not (Test-Path "target\release\librustdesk.dll")) { throw "未生成 librustdesk.dll" }
          Get-Item "target\release\librustdesk.dll" |
            ForEach-Object { Write-Host "librustdesk.dll: $([math]::Round($_.Length/1MB,1)) MB" }

      - name: 编译 Flutter UI
        shell: pwsh
        run: |
          Set-Location flutter
          flutter pub get
          flutter build windows --release
          if ($LASTEXITCODE -ne 0) { throw "flutter build 失败" }

      - name: 打包产物
        shell: pwsh
        run: |
          $rel = "flutter\build\windows\x64\runner\Release"
          if (-not (Test-Path "$rel\rustdesk.exe")) { throw "未生成 rustdesk.exe" }

          $out = "dist"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item "$rel\*" $out -Recurse -Force

          $vd = "target\release\deps\dylib_virtual_display.dll"
          if (Test-Path $vd) { Copy-Item $vd $out -Force }

          Compress-Archive -Path "$out\*" -DestinationPath "lumendesk-windows.zip" -Force
          Get-ChildItem "lumendesk-windows.zip" | ForEach-Object {
            Write-Host "产物大小: $([math]::Round($_.Length/1MB,1)) MB"
          }
          Get-ChildItem $out | Select-Object Name | Format-Table -AutoSize

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: lumendesk-windows-${{ github.sha }}
          path: lumendesk-windows.zip
          retention-days: 30

      # 失败时把关键日志写回 ci-logs 分支，便于不带登录态也能定位问题
      - name: 失败时把日志写回仓库
        if: failure()
        shell: pwsh
        continue-on-error: true
        run: |
          $lines = @()
          $lines += "# CI 失败日志"
          $lines += ""
          $lines += "- run: ${{ github.run_id }}"
          $lines += "- sha: ${{ github.sha }}"
          $lines += "- rust: ${{ env.RUST_VERSION }}"
          $lines += ""
          $lines += "## 编译器错误摘要"
          $lines += '```'
          if (Test-Path cargo-build.log) {
            $lines += Get-Content cargo-build.log |
              Select-String -Pattern "error\[E|^error:|could not compile|panicked at" |
              Select-Object -First 60 | ForEach-Object { $_.Line }
          } else {
            $lines += "(无 cargo-build.log：失败发生在 Rust 编译之前)"
          }
          $lines += '```'
          $lines += ""
          $lines += "## cargo 输出尾部"
          $lines += '```'
          if (Test-Path cargo-build.log) { $lines += Get-Content cargo-build.log -Tail 300 }
          $lines += '```'
          $lines += ""
          $lines += "## vcpkg 构建日志尾部"
          $lines += '```'
          Get-ChildItem "C:\vcpkg\buildtrees" -Recurse -Filter "*.log" -ErrorAction SilentlyContinue |
            Select-Object -First 12 | ForEach-Object {
              $lines += "===== $($_.Directory.Name)/$($_.Name) ====="
              $lines += Get-Content $_.FullName -Tail 15
            }
          $lines += '```'
          $lines -join "`n" | Set-Content ci-error.log -Encoding utf8

          git config user.name "ci-bot"
          git config user.email "ci-bot@lumendesk.local"
          git checkout -B ci-logs
          git add -f ci-error.log
          git commit -m "ci: failure log ${{ github.run_id }}"
          git push -f origin ci-logs
