name: Build Windows Client

# 说明
# ----
# 与上游 CI（.github/workflows-disabled/flutter-build.yml）对齐的三处关键做法：
#   1. vcpkg 固定在 vcpkg.json 里声明的 baseline（9e593bb1），避免 runner 自带的
#      版本与清单不一致导致端口解析失败。
#   2. 依赖安装用 classic 模式（cwd 切到 C:\vcpkg）。仓库根目录有 vcpkg.json，
#      在根目录执行 `vcpkg install <包名>` 会进入 manifest 模式，而 manifest 模式
#      不接受单独指定包名，会直接报错退出——这是上一次 73 秒失败的原因。
#   3. overlay 端口用仓库自带的 res/vcpkg，而不是外部目录。res/vcpkg 里含
#      aom / libvpx / libyuv / opus 的上游补丁，缺了这些补丁安装阶段会失败。
#
# 只装 RustDesk 实际链接的 4 个库（libvpx / aom / libyuv / opus），跳过 ffmpeg：
# libs/scrap/build.rs 里 `// ffmpeg();` 是注释状态，纯软件编码路径不需要它，
# 可省下约 40 分钟构建时间。
#
# 上游自带的 11 个 workflow 已移至 .github/workflows-disabled/，
# GitHub 只扫描 workflows 顶层目录，因此不会被执行。

on:
  push:
    branches: [master, main]
  workflow_dispatch:

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  # 与 vcpkg.json 的 vcpkg-configuration.default-registry.baseline 保持一致
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  # 与上游 build-for-windows-flutter 任务一致（Cargo.lock 就是按该版本锁定的）
  RUST_VERSION: "1.75"
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build-windows:
    name: 构建 Windows 客户端
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: 拉取源码
        uses: actions/checkout@v5

      - name: 准备 vcpkg（固定到清单声明的版本）
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          runVcpkgInstall: false
          # 关闭自带缓存：它走 Actions 缓存服务，在本仓库的长作业里稳定返回 400/503
          doNotCache: true

      - name: 安装 Rust
        # 与上游 CI 相同的固定版本（v1 的 SHA）
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          # flutter_rust_bridge_codegen 生成代码后调用 rustfmt 格式化，
          # 缺这个组件会直接报 "rustfmt.exe is not installed"
          components: rustfmt

      - name: 安装 Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.5
          channel: stable
          # 同上：SDK 每次重新下载，换取缓存链路零告警
          cache: false

      - name: 安装绑定生成工具
        shell: pwsh
        env:
          FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
          CARGO_EXPAND_VERSION: "1.0.95"
        run: |
          # 放在原生依赖之前，工具装不上时几分钟内就能暴露，不必等 vcpkg 编完
          "=== cargo-expand ===" | Tee-Object -FilePath tools-install.log
          cargo install cargo-expand --version $env:CARGO_EXPAND_VERSION --locked 2>&1 |
            Tee-Object -FilePath tools-install.log -Append
          if ($LASTEXITCODE -ne 0) { throw "cargo-expand 安装失败" }

          "=== flutter_rust_bridge_codegen ===" | Tee-Object -FilePath tools-install.log -Append
          cargo install flutter_rust_bridge_codegen --version $env:FLUTTER_RUST_BRIDGE_VERSION --features uuid --locked 2>&1 |
            Tee-Object -FilePath tools-install.log -Append
          if ($LASTEXITCODE -ne 0) { throw "flutter_rust_bridge_codegen 安装失败" }

      - name: 拉取 Dart 依赖
        shell: pwsh
        run: |
          Push-Location flutter
          flutter pub get 2>&1 | Tee-Object -FilePath $env:GITHUB_WORKSPACE\pubget.log
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { throw "flutter pub get 失败" }

      # 不再使用 Actions 缓存服务：实测在长作业里它对建仓的请求会返回 400/503，
      # 且各项隔离测试（键、路径、体积、单个/多个 action、x-gha 组合）全部正常，
      # 属服务端行为，配置层无法规避。改为把依赖包放在 Release 附件（对象存储），
      # 走 gh CLI 直接下载/上传，同样能省掉重复编译，且不会产生任何缓存告警。
      - name: 尝试获取已编译依赖
        id: vcpkg-cache
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $hit = "false"
          # 首次运行时 vcpkg-deps 还不存在，gh 会返回非零；这是预期路径，不能让它判失败
          gh release download vcpkg-deps --pattern installed.zip --dir C:\vcpkg --clobber 2>$null
          if (Test-Path "C:\vcpkg\installed.zip") {
            $hit = "true"
            Expand-Archive -Path "C:\vcpkg\installed.zip" -DestinationPath "C:\vcpkg" -Force
            Get-ChildItem "C:\vcpkg\installed\x64-windows-static\lib" |
              Select-Object Name, @{N='MB';E={[math]::Round($_.Length/1MB,1)}} |
              Format-Table -AutoSize
          } else {
            Write-Host "没有可复用的依赖包，将重新编译"
          }
          "hit=$hit" >> $env:GITHUB_OUTPUT
          Write-Host "依赖包命中: $hit"
          # 显式归零，避免把 gh 的非零退出码带成步骤失败
          exit 0

      - name: 编译原生依赖
        if: steps.vcpkg-cache.outputs.hit != 'true'
        shell: pwsh
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # classic 模式：切到 vcpkg 目录执行，绕开 manifest 模式不接受包名的限制
          Push-Location "C:\vcpkg"
          & "C:\vcpkg\vcpkg.exe" install libvpx aom libyuv opus `
            --triplet x64-windows-static `
            --x-install-root="C:\vcpkg\installed" `
            --overlay-ports="$env:GITHUB_WORKSPACE\res\vcpkg"
          $code = $LASTEXITCODE
          Pop-Location

          if ($code -ne 0) {
            Write-Host "::group::vcpkg 构建日志"
            Get-ChildItem "C:\vcpkg\buildtrees" -Recurse -Filter "*.log" -ErrorAction SilentlyContinue |
              ForEach-Object {
                Write-Host "===== $($_.FullName) ====="
                Get-Content $_.FullName -Tail 40
              }
            Write-Host "::endgroup::"
            throw "vcpkg install 失败（exit $code）"
          }

          Get-ChildItem "C:\vcpkg\installed\x64-windows-static\lib" -ErrorAction SilentlyContinue |
            Select-Object Name, @{N='MB';E={[math]::Round($_.Length/1MB,1)}} |
            Format-Table -AutoSize

          # 记录 libyuv 实际使用的编译器，供下一步断言。
          # res/vcpkg/libyuv 端口在检测到 MSVC 时会强切 clang-cl（SIMD 优化只在 clang 下完整），
          # 但它末尾的 WARNING 是按 triplet 的编译器 ID 判断的，属误报；
          # 这里改成读构建日志里的真实识别结果，避免"以为用了 clang 其实没用到"
          $cfg = Get-ChildItem "C:\vcpkg\buildtrees\libyuv" -Filter "config-*-rel-out.log" -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($cfg) {
            $line = Select-String -Path $cfg.FullName -Pattern "The C compiler identification is .+" |
              Select-Object -First 1
            if ($line) {
              $stamp = "C:\vcpkg\installed\x64-windows-static\share\libyuv\compiler.txt"
              New-Item -ItemType Directory -Force -Path (Split-Path $stamp) | Out-Null
              Set-Content -Path $stamp -Value $line.Line.Trim() -Encoding utf8
              Write-Host "libyuv 编译器: $($line.Line.Trim())"
            }
          }

          # 打成单文件，上传到 Release vcpkg-deps，供后续运行直接复用
          Compress-Archive -Path "C:\vcpkg\installed" -DestinationPath "C:\vcpkg\installed.zip" -Force
          Get-Item "C:\vcpkg\installed.zip" |
            ForEach-Object { Write-Host "依赖包大小: $([math]::Round($_.Length/1MB,1)) MB" }

          gh release view vcpkg-deps 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create vcpkg-deps --title "vcpkg 预编译依赖" `
              --notes "CI 自动生成并复用，请勿手动删除" --prerelease
          }
          gh release upload vcpkg-deps C:\vcpkg\installed.zip --clobber
          Write-Host "已上传依赖包，下次运行可直接命中"

      - name: 校验 libyuv 使用 clang-cl 编译
        shell: pwsh
        run: |
          $stamp = "C:\vcpkg\installed\x64-windows-static\share\libyuv\compiler.txt"
          if (-not (Test-Path $stamp)) { throw "缺少 libyuv 编译器记录，无法确认编译方式" }
          $line = (Get-Content $stamp -Raw).Trim()
          Write-Host $line
          if ($line -notmatch "Clang") {
            throw "libyuv 不是 clang-cl 编译（$line），性能会明显下降，构建终止"
          }
          Write-Host "OK: libyuv 由 clang-cl 编译，SIMD 优化路径完整"

      - name: 生成 flutter_rust_bridge 绑定
        shell: pwsh
        env:
          # codegen 内部走 cargo expand，会构建 scrap 的 build script，
          # 因此必须能定位到前面装好的原生库
          VCPKG_ROOT: C:\vcpkg
          VCPKG_DEFAULT_TRIPLET: x64-windows-static
        run: |
          # src/bridge_generated*.rs 与 flutter/lib/generated_bridge*.dart 都在
          # .gitignore 里，仓库不带这两组文件，必须现场生成
          $codegen = Join-Path $env:USERPROFILE ".cargo\bin\flutter_rust_bridge_codegen.exe"
          & $codegen `
            --rust-input ./src/flutter_ffi.rs `
            --dart-output ./flutter/lib/generated_bridge.dart 2>&1 |
            Tee-Object -FilePath codegen.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content codegen.log -Tail 60
            throw "flutter_rust_bridge_codegen 失败"
          }

          $need = @(
            "src\bridge_generated.rs",
            "src\bridge_generated.io.rs",
            "flutter\lib\generated_bridge.dart"
          )
          foreach ($f in $need) {
            if (-not (Test-Path $f)) { throw "未生成 $f" }
            Write-Host "OK  $f"
          }

          # 若生成的 dart 里声明了 freezed part，则需要 build_runner 产出配套文件
          $dart = "flutter\lib\generated_bridge.dart"
          $freezed = "flutter\lib\generated_bridge.freezed.dart"
          if ((Select-String -Path $dart -Pattern "generated_bridge\.freezed\.dart" -Quiet) -and
              -not (Test-Path $freezed)) {
            Write-Host "缺少 freezed 配套文件，运行 build_runner"
            Push-Location flutter
            dart run build_runner build --delete-conflicting-outputs 2>&1 |
              Tee-Object -FilePath $env:GITHUB_WORKSPACE\buildrunner.log -Append
            $br = $LASTEXITCODE
            Pop-Location
            if ($br -ne 0) { throw "build_runner 失败" }
            if (-not (Test-Path $freezed)) { throw "仍未生成 $freezed" }
          }

      - name: 编译 Rust 核心
        shell: pwsh
        env:
          VCPKG_ROOT: C:\vcpkg
          VCPKG_DEFAULT_TRIPLET: x64-windows-static
        run: |
          rustc --version
          cargo --version

          # 不用 --locked：Cargo.toml 用上游的 git 依赖（portable-pty 走
          # rustdesk-org/wezterm），锁文件里的 registry 记录需据此重新解析
          cargo build --features flutter --lib --release 2>&1 |
            Tee-Object -FilePath cargo-build.log
          $code = $LASTEXITCODE

          if ($code -ne 0) { throw "cargo build 失败（exit $code）" }
          if (-not (Test-Path "target\release\librustdesk.dll")) { throw "未生成 librustdesk.dll" }
          Get-Item "target\release\librustdesk.dll" |
            ForEach-Object { Write-Host "librustdesk.dll: $([math]::Round($_.Length/1MB,1)) MB" }

      - name: 编译 Flutter UI
        shell: pwsh
        run: |
          Set-Location flutter
          flutter pub get
          flutter build windows --release
          if ($LASTEXITCODE -ne 0) { throw "flutter build 失败" }

      - name: 打包产物
        shell: pwsh
        run: |
          $rel = "flutter\build\windows\x64\runner\Release"
          if (-not (Test-Path "$rel\rustdesk.exe")) { throw "未生成 rustdesk.exe" }

          $out = "dist"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item "$rel\*" $out -Recurse -Force

          $vd = "target\release\deps\dylib_virtual_display.dll"
          if (Test-Path $vd) { Copy-Item $vd $out -Force }

          Compress-Archive -Path "$out\*" -DestinationPath "lumendesk-windows.zip" -Force
          Get-ChildItem "lumendesk-windows.zip" | ForEach-Object {
            Write-Host "产物大小: $([math]::Round($_.Length/1MB,1)) MB"
          }
          Get-ChildItem $out | Select-Object Name | Format-Table -AutoSize

      - name: 上传产物
        uses: actions/upload-artifact@v6
        with:
          name: lumendesk-windows-${{ github.sha }}
          path: lumendesk-windows.zip
          retention-days: 30

      # Artifact 下载要账号鉴权，外部无法直接取；Release 附件在公开仓库可匿名下载，
      # 这样产物就能被自动取走并交付到本机
      - name: 发布到 Release
        if: success()
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          name: LumenDesk Windows 构建 #${{ github.run_number }}
          body: |
            自动构建的 Windows 客户端（主控端与被控端为同一程序）。

            - 提交：`${{ github.sha }}`
            - 运行：https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - 内容：`rustdesk.exe` + `librustdesk.dll` + 运行库
          files: lumendesk-windows.zip
          prerelease: true
          draft: false

      # 失败时把关键日志写回 ci-logs 分支，便于不带登录态也能定位问题
      - name: 失败时把日志写回仓库
        if: failure()
        shell: pwsh
        continue-on-error: true
        run: |
          $lines = @()
          $lines += "# CI 失败日志"
          $lines += ""
          $lines += "- run: ${{ github.run_id }}"
          $lines += "- sha: ${{ github.sha }}"
          $lines += "- rust: ${{ env.RUST_VERSION }}"
          $lines += ""
          $lines += "## 编译器错误摘要"
          $lines += '```'
          if (Test-Path cargo-build.log) {
            $lines += Get-Content cargo-build.log |
              Select-String -Pattern "error\[E|^error:|could not compile|panicked at" |
              Select-Object -First 60 | ForEach-Object { $_.Line }
          } else {
            $lines += "(无 cargo-build.log：失败发生在 Rust 编译之前)"
          }
          $lines += '```'
          $lines += ""
          $lines += "## 各步骤日志尾部"
          $lines += '```'
          Get-ChildItem $env:GITHUB_WORKSPACE -Filter "*.log" -ErrorAction SilentlyContinue |
            ForEach-Object {
              $lines += "########## $($_.Name) ##########"
              $lines += Get-Content $_.FullName -Tail 300
              $lines += ""
            }
          $lines += '```'
          $lines += ""
          $lines += "## vcpkg 构建日志尾部"
          $lines += '```'
          Get-ChildItem "C:\vcpkg\buildtrees" -Recurse -Filter "*.log" -ErrorAction SilentlyContinue |
            Select-Object -First 12 | ForEach-Object {
              $lines += "===== $($_.Directory.Name)/$($_.Name) ====="
              $lines += Get-Content $_.FullName -Tail 15
            }
          $lines += '```'
          $lines -join "`n" | Set-Content ci-error.log -Encoding utf8

          git config user.name "ci-bot"
          git config user.email "ci-bot@lumendesk.local"
          git checkout -B ci-logs
          git add -f ci-error.log
          git commit -m "ci: failure log ${{ github.run_id }}"
          git push -f origin ci-logs
